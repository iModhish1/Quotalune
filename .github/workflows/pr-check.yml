name: PR checks

# QuotaArc CI: GitHub Actions is the canonical PR gate (divergence from
# upstream's CircleCI choice — see docs/UPSTREAM_SYNC.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust fmt / clippy / test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: clippy (shared crate)
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: tests (shared crate)
        run: cargo test --manifest-path rust/Cargo.toml

      - name: clippy (shell crate)
        run: cargo clippy --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: tests (shell crate)
        run: cargo test --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml

  frontend:
    name: Frontend locale / typecheck / tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Locale drift check
        run: pnpm run check-locale

      - name: Typecheck + build
        run: pnpm run build

      - name: Tests
        run: pnpm test
