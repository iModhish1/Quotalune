<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    QuotaArc app icon — original brand mark.
    Motif: a capacity gauge. A subtle full ring is the total capacity; the
    270-degree colored arc is what you have left; the endpoint dot marks
    where you are on the gauge.
    Geometry: ring center (32, 35.93), radius 19; arc from 134.9deg
    (bottom-left) sweeping 270deg clockwise to 45.1deg (bottom-right).
  -->
  <defs>
    <linearGradient id="qa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C30"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="qa-arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Icon tile -->
  <rect width="64" height="64" rx="14" fill="url(#qa-bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Total-capacity track -->
  <circle cx="32" cy="35.93" r="19" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="6"/>

  <!-- Remaining-capacity arc -->
  <path d="M 18.6 49.4 A 19 19 0 1 1 45.4 49.4"
        fill="none"
        stroke="url(#qa-arc)"
        stroke-width="6"
        stroke-linecap="round"/>

  <!-- Current position on the gauge -->
  <circle cx="45.4" cy="49.4" r="4.4" fill="#F8FAFC"/>
</svg>
